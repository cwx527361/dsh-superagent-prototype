[project]
name = "dsh-runner"
version = "0.1.0"
description = "Local execution agent for the dsh-superagent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=15.0",
    "cryptography>=43.0",
]

[project.scripts]
dsh-runner = "dsh_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsh_runner"]
